name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test-backend:
    name: Run .NET Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' 
          
      - name: Restore dependencies
        # Restores the test project specifically
        run: dotnet restore server/IntegrationTests/IntegrationTests.csproj 
        
      - name: Build and Test
        # Builds and runs the tests in one go
        run: dotnet test server/IntegrationTests/IntegrationTests.csproj --verbosity normal

  test-e2e:
    name: Run Playwright E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Install Bun (This fixes the 'bun: not found' error)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          
      - name: Install Client Dependencies
        working-directory: ./client
        run: bun install

      # 2. Install Node (Required for Playwright)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install E2E Dependencies
        working-directory: ./tests/E2ETests
        run: npm ci

      # 3. Run the Tests
      - name: Install Playwright Browsers
        working-directory: ./tests/E2ETests
        run: npx playwright install --with-deps
        
      - name: Run Playwright Tests
        working-directory: ./tests/E2ETests
        run: npx playwright test