name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test-backend:
    name: Run .NET Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' 
          
      - name: Restore dependencies
        # Restores the test project specifically
        run: dotnet restore server/IntegrationTests/IntegrationTests.csproj 
        
      - name: Build and Test
        # Builds and runs the tests in one go
        run: dotnet test server/IntegrationTests/IntegrationTests.csproj --verbosity normal

  test-e2e:
    name: Run Playwright E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        # Pointing to your specific E2E folder
        working-directory: ./tests/E2ETests
    steps:
      - uses: actions/checkout@v4

      # Using Node/npm since you have a package-lock.json in the E2ETests folder
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test